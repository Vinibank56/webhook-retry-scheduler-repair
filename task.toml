schema_version = "1.0"
version = "1.0"

artifacts = ["/app"]

[task]
name = "webhook-retry-scheduler-repair"
description = "Repair a broken webhook delivery retry scheduler that must compute exponential backoff, deterministic jitter, Retry-After floors, and dead-letter cutoffs."

[metadata]
name = "webhook-retry-scheduler-repair"
author_name = "Vincent Onuegbunam"
author_email = "onuegbunamvincent@gmail.com"
author_organization = ""
difficulty_explanation = "The seed scheduler violates six independent timing rules that each look plausible in isolation: dead-letter uses > instead of >=; backoff exponent is off-by-one; jitter is applied additively; Retry-After floors are ignored; max_delay_ms is never enforced; and timestamps truncate to whole seconds. Agents must read instruction.md, treat helper modules as canonical, and implement the full contract — patching one bug still fails held-out cases that use unpublished delivery IDs, alternate multipliers, zero jitter, and max_attempts=1. Hidden tests also verify behavioral invariants (now + delay_ms == next_attempt_at) and compare against a sealed spec reference the agent never sees."
solution_explanation = "solution/solve.sh installs the reference scheduler.py which implements every rule in instruction.md using the provided helpers: dead-letter at failed_attempt >= max_attempts; raw_exponential with exponent (failed_attempt - 1) capped before Retry-After; Retry-After as a floor that does not alter the capped flag; multiplicative jitter via deterministic_jitter; millisecond-precise timestamps via add_milliseconds and format_instant. The script runs the full visible + hidden pytest suite before grading."
verification_explanation = "tests/test.sh runs pytest over test_visible.py (5 self-check cases), test_hidden.py (edge cases, unpublished IDs, audit semantics), and test_behavior_hidden.py (backoff progression, jitter bounds, anti-stub, stress cap, spec-reference matrix). Sealed spec_reference.py and invariants.py enforce behavior beyond visible literals. Binary scoring."
domain = "systems"
field = "backend"
subfield = "webhooks"
tags = ["debugging", "webhooks", "retry", "backoff", "python", "exponential-backoff"]
expert_time_estimate_hours = 2.5
relevant_experience = "Backend and platform engineering experience implementing webhook delivery pipelines with retry policies, Retry-After compliance, and idempotency."
conflicts_of_interest = "None"

[verifier]
timeout_sec = 600.0
environment_mode = "shared"
network_mode = "none"

[agent]
timeout_sec = 7200.0
network_mode = "none"

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 2048
storage_mb = 4096
gpus = 0
